id: https://sen-labs.org/ns/oni/movies
name: sen_movies
title: SEN Movies
description: This ontology defines entities and relations for working with movies (film analysis, writing).
version: 0.1.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  sen: https://sen-labs.org/ns/sen#
  dc: http://purl.org/dc/elements/1.1/
  dcterms: http://purl.org/dc/terms/
  schema: https://schema.org/
  oa: http://www.w3.org/ns/oa#
  be: https://www.haiku-os.org/ns/be#
default_prefix: sen
default_range: string
imports:
  - linkml:types
  - sen-core
annotations:
  oni_author: Gregor B. Rosenauer <gregor.rosenauer@gmail.com>
  oni_stable: false
  oni_schema_url: https://github.com/sen-laboratories/sen-oni/tree/main/schema/sen-movies.yaml

slots:
  scene:
    title: Scene
    annotations: {attribute: "SEN:REL:scene"}
  chapter_start:
    title: Chapter Start
    range: integer
    annotations: {attribute: "SEN:REL:chapterStart", width: 30}
  chapter_end:
    title: Chapter End
    range: integer
    annotations: {attribute: "SEN:REL:chapterEnd", width: 30}
  time_start:
    description: Start of the place in the movie, in seconds.
    title: Time Code Start
    slot_uri: schema:startOffset
    range: integer
    annotations: {attribute: "schema:startOffset", width: 30}
  time_end:
    description: End of the place in the movie, in seconds.
    title: Time Code End
    slot_uri: schema:endOffset
    range: integer
    annotations: {attribute: "schema:endOffset", width: 30}

  # ---- what a movie has (schema.org Movie; the people who made it are people with a Contribution to it; director and actor are only the names, for when the
  # settings say that entities are not made as files)
  title:
    title: Title
    slot_uri: dc:title
    annotations: {attribute: "dc:title"}
  original_title:
    description: The title in the original language, if it is another one.
    title: Original Title
    slot_uri: schema:alternateName
    annotations: {attribute: "schema:alternateName", viewable: false}
  release_date:
    description: The date of the first release.
    title: Released
    slot_uri: schema:datePublished
    range: datetime
    annotations: {attribute: "schema:datePublished", width: 30}
  duration:
    description: The length of the movie, as an ISO 8601 duration (PT2H28M).
    title: Duration
    slot_uri: schema:duration
    annotations: {attribute: "schema:duration", width: 30}
  director:
    description: The names of the directors, when the people are not entities of their own (otherwise they are the people with a Contribution to the movie).
    title: Directors
    slot_uri: schema:director
    annotations: {attribute: "schema:director", is_list: true, viewable: false}
  actor:
    description: The names of the main actors, when the people are not entities of their own.
    title: Actors
    slot_uri: schema:actor
    annotations: {attribute: "schema:actor", is_list: true, viewable: false}
  description:
    description: What the movie is about.
    title: Description
    slot_uri: dc:description
    annotations: {attribute: "dc:description", viewable: false}
  genre:
    title: Genres
    slot_uri: schema:genre
    annotations: {attribute: "schema:genre", is_list: true}
  in_language:
    description: The languages of the movie (the original one first), as language codes.
    title: Languages
    slot_uri: schema:inLanguage
    annotations: {attribute: "schema:inLanguage", is_list: true, viewable: false}
  country_of_origin:
    title: Countries
    slot_uri: schema:countryOfOrigin
    annotations: {attribute: "schema:countryOfOrigin", is_list: true, viewable: false}
  image:
    description: The page of the poster (the thumbnail is the poster itself).
    title: Poster
    slot_uri: schema:image
    annotations: {attribute: "schema:image", viewable: false}
  poster_license:
    description: The license of the poster, or where it is from.
    title: Poster License
    slot_uri: schema:license
    annotations: {attribute: "schema:license", viewable: false}
  same_as:
    description: Where else the movie is known (Wikidata, IMDb, TMDB, Letterboxd), as a list of IRIs.
    title: Same As
    slot_uri: schema:sameAs
    annotations: {attribute: "schema:sameAs", is_list: true, viewable: false, width: 150}

classes:
  Movie:
    description: a movie
    title: Movie
    is_a: Entity
    class_uri: schema:Movie
    slots: [title, original_title, release_date, duration, director, actor, description, genre, in_language, country_of_origin, image, poster_license, same_as]
    slot_usage: {plural: {ifabsent: "string(Movies)"}}
    annotations: {mime: entity/x-vnd.sen-labs.entity.movie, icon: x-vnd.sen-labs.entity.movie}
  MovieMedium:
    description: a physical movie medium (VHS,DVD,Bluray)
    title: Movie medium
    is_a: Entity
    slot_usage: {plural: {ifabsent: "string(Movie media)"}}
    annotations: {mime: entity/x-vnd.sen-labs.entity.movie.medium}
  MovieReference:
    description: Reference to a Movie
    title: Movie Reference
    is_a: Relation
    slots: [scene, chapter_start, chapter_end, time_start, time_end]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.movie.reference
      target_types: entity/x-vnd.sen-labs.entity.movie,video/
