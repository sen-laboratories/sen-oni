#
# People and organizations, and how they relate to each other: from professional relationships (colleague, superior, mentor, client...) to personal ones
# (acquaintance, friend, close friend, partner, family). The attributes of a person are those of FOAF (Friend of a Friend) and schema.org; the kinds of
# relationships follow the Relationship vocabulary (REL, an extension of FOAF: acquaintanceOf, friendOf, closeFriendOf, colleagueOf, mentorOf, parentOf,
# ...), each one is a relation of its own so that it can be chosen, shown and queried by what it is. What is the same in both directions (friend of) has
# the same label on both sides; what is not has both (superior of / subordinate of).
#
# In the menus the relations are in groups (Personal, Family, Professional, Organizations: the annotation group), so that the list of the kinds is short.
#
# The relations start at a person (the type of SEN, entity/x-vnd.sen-labs.entity.person, is the one that new people are made as). The contacts of the People
# application of Haiku (application/x-person, the legacy type) are accepted too, after it, as sources and, since they end at the kinds of files that they can start at,
# as targets: the people that exist can be found and related; those between a person and an organization end at an organization. Opening the relation in a
# relation folder opens the person or organization that it ends at, with the personal relation navigator.
#
# A relation has the properties Since (when it began) and Note, which are attributes of the file that stands for it in a relation folder.
id: https://sen-labs.org/ns/oni/people
name: sen_people
title: SEN People
description: This ontology defines people and organizations, and personal and professional relationships between them.
version: 0.1.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  sen: https://sen-labs.org/ns/sen#
  dc: http://purl.org/dc/elements/1.1/
  schema: https://schema.org/
  foaf: http://xmlns.com/foaf/0.1/
  vcard: http://www.w3.org/2006/vcard/ns#
  rel: http://purl.org/vocab/relationship/
  be: https://www.haiku-os.org/ns/be#
default_prefix: sen
default_range: string
imports:
  - linkml:types
  - sen-core
annotations:
  oni_author: Gregor B. Rosenauer <gregor.rosenauer@gmail.com>
  oni_stable: false
  oni_schema_url: https://github.com/sen-laboratories/sen-oni/tree/main/schema/sen-people.yaml

slots:
  name:
    description: The full name (of a person or an organization).
    title: Name
    slot_uri: foaf:name
    annotations: {attribute: "foaf:name", width: 150}
  given_name:
    title: Given Name
    slot_uri: foaf:givenName
    annotations: {attribute: "foaf:givenName", width: 90}
  family_name:
    title: Family Name
    slot_uri: foaf:familyName
    annotations: {attribute: "foaf:familyName", width: 100}
  nickname:
    title: Nickname
    slot_uri: foaf:nick
    annotations: {attribute: "foaf:nick", viewable: false, width: 80}
  mbox:
    description: The e-mail address.
    title: E-mail
    slot_uri: foaf:mbox
    annotations: {attribute: "foaf:mbox", width: 150}
  phone:
    title: Phone
    slot_uri: foaf:phone
    annotations: {attribute: "foaf:phone", width: 100}
  homepage:
    title: Homepage
    slot_uri: foaf:homepage
    annotations: {attribute: "foaf:homepage", viewable: false, width: 150}
  birth_date:
    title: Birthday
    slot_uri: schema:birthDate
    range: datetime
    annotations: {attribute: "schema:birthDate", width: 90}
  job_title:
    title: Job Title
    slot_uri: schema:jobTitle
    annotations: {attribute: "schema:jobTitle", width: 110}
  description:
    title: Description
    slot_uri: dc:description
    annotations: {attribute: "dc:description", viewable: false}
  same_as:
    description: Where else the person is known (ORCID, Wikidata, OpenAlex...), as a list of IRIs.
    title: Same As
    slot_uri: schema:sameAs
    annotations: {attribute: "schema:sameAs", is_list: true, viewable: false, width: 150}
  image:
    description: The page of the photo of the person (the thumbnail is the photo itself).
    title: Photo
    slot_uri: schema:image
    annotations: {attribute: "schema:image", viewable: false, width: 150}
  photo_license:
    description: The license of the photo.
    title: Photo License
    slot_uri: schema:license
    annotations: {attribute: "schema:license", viewable: false, width: 100}
  photo_credit:
    description: Who made the photo, as its license asks to say.
    title: Photo Credit
    slot_uri: schema:creditText
    annotations: {attribute: "schema:creditText", viewable: false, width: 150}
  groups:
    description: The groups that a person is in (Family, Friends, ...), as a list.
    title: Groups
    slot_uri: vcard:category
    annotations: {attribute: "vcard:category", is_list: true, width: 120}
  # ---- the attributes of the People application of Haiku (application/x-person), as Haiku defines them
  be_name:
    title: Contact name
    annotations: {attribute: "META:name", width: 120}
  be_company:
    title: Company
    annotations: {attribute: "META:company", width: 120}
  be_address:
    title: Address
    annotations: {attribute: "META:address", width: 120}
  be_city:
    title: City
    annotations: {attribute: "META:city", width: 90}
  be_state:
    title: State
    annotations: {attribute: "META:state", width: 50}
  be_zip:
    title: Zip
    annotations: {attribute: "META:zip", width: 50}
  be_country:
    title: Country
    annotations: {attribute: "META:country", width: 120}
  be_email:
    title: E-mail
    annotations: {attribute: "META:email", width: 120}
  be_hphone:
    title: Home phone
    annotations: {attribute: "META:hphone", width: 90}
  be_mphone:
    title: Mobile phone
    annotations: {attribute: "META:mphone", width: 90}
  be_wphone:
    title: Work phone
    annotations: {attribute: "META:wphone", width: 90}
  be_fax:
    title: Fax
    annotations: {attribute: "META:fax", width: 90}
  be_url:
    title: URL
    annotations: {attribute: "META:url", width: 120}
  be_group:
    title: Group
    annotations: {attribute: "META:group", width: 120, is_list: true}
  be_nickname:
    title: Nickname
    annotations: {attribute: "META:nickname", width: 120}
  rel_since:
    description: When the relationship began.
    title: Since
    range: datetime
    annotations: {attribute: "SEN:REL:since", width: 90}
  rel_note:
    description: What there is to say about the relationship.
    title: Note
    annotations: {attribute: "SEN:REL:note", width: 160}

classes:
  Person:
    description: a person
    title: Person
    is_a: Entity
    class_uri: foaf:Person
    slots: [name, given_name, family_name, nickname, mbox, phone, homepage, birth_date, job_title, groups, description, same_as, image, photo_license, photo_credit]
    annotations: {mime: entity/x-vnd.sen-labs.entity.person, icon: x-vnd.sen-labs.entity.person}

  # The type of the People application of Haiku. It is not ours: only its attribute info is written (an overlay: the user's MIME database adds to
  # the type of the system), the same attributes as Haiku has them, and the group of a person is a list ("Family, Friends").
  PeoplePerson:
    description: a person of the People application of Haiku
    title: Person
    class_uri: foaf:Person
    slots: [be_name, be_company, be_address, be_city, be_state, be_zip, be_country, be_email, be_hphone, be_mphone, be_wphone, be_fax, be_url, be_group, be_nickname]
    annotations: {mime: application/x-person, overlay: true}

  Organization:
    description: a company, institution, club or any other group of people with a name
    title: Organization
    is_a: Entity
    class_uri: foaf:Organization
    slots: [name, mbox, phone, homepage, description]
    annotations: {mime: entity/x-vnd.sen-labs.entity.organization, icon: x-vnd.sen-labs.entity.organization}

  # ---- what two people know of each other, from least to most close
  PersonalRelation:
    description: what people are to one another, in no particular way ("knows"), the relation that all the other kinds of personal relations are special cases of
    title: Personal Relation
    is_a: Relation
    class_uri: foaf:knows
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Personal
      label: knows
      inverse_label: known by
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Acquaintance:
    description: people who have met and know each other a little
    title: Acquaintance
    is_a: Relation
    class_uri: rel:acquaintanceOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.acquaintance
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Personal
      label: acquainted with
      inverse_label: acquainted with
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Friend:
    description: people who like and trust each other
    title: Friend
    is_a: Relation
    class_uri: rel:friendOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.friend
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Personal
      label: friend of
      inverse_label: friend of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  CloseFriend:
    description: people who are very close, who share what matters to them
    title: Close Friend
    is_a: Relation
    class_uri: rel:closeFriendOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.close-friend
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Personal
      label: close friend of
      inverse_label: close friend of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Partner:
    description: people who live their lives together (life partners, spouses)
    title: Partner
    is_a: Relation
    class_uri: rel:lifePartnerOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.partner
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Personal
      label: partner of
      inverse_label: partner of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  # ---- family
  Parent:
    description: a person is the parent of another one
    title: Parent
    is_a: Relation
    class_uri: rel:parentOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.parent
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Family
      label: parent of
      inverse_label: child of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Sibling:
    description: people who have a parent in common
    title: Sibling
    is_a: Relation
    class_uri: rel:siblingOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.sibling
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Family
      label: sibling of
      inverse_label: sibling of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Relative:
    description: people who are related by blood or marriage, in another way than parent, child or sibling
    title: Relative
    is_a: Relation
    class_uri: rel:relatedTo
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.relative
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Family
      label: relative of
      inverse_label: relative of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  # ---- professional
  Colleague:
    description: people who work in the same organization, or in the same field, and none is the superior of the other
    title: Colleague
    is_a: Relation
    class_uri: rel:colleagueOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.colleague
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Professional
      label: colleague of
      inverse_label: colleague of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Superior:
    description: a person is the superior (manager, supervisor, lead) of another one
    title: Superior
    is_a: Relation
    class_uri: rel:employerOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.superior
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Professional
      label: superior of
      inverse_label: subordinate of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Mentor:
    description: a person guides the professional or personal growth of another one
    title: Mentor
    is_a: Relation
    class_uri: rel:mentorOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.mentor
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Professional
      label: mentor of
      inverse_label: mentee of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Collaborator:
    description: people who work together on something, without one of them being the superior of the other
    title: Collaborator
    is_a: Relation
    class_uri: rel:collaboratesWith
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.collaborator
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Professional
      label: collaborates with
      inverse_label: collaborates with
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Client:
    description: a person is the client (customer, patient, student) of another one
    title: Client
    is_a: Relation
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.client
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.person
      group: Professional
      label: client of
      inverse_label: provider of
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Employment:
    description: a person works for an organization
    title: Employment
    is_a: Relation
    class_uri: schema:worksFor
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.employment
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.organization
      group: Organizations
      # stored at the person only: what points to an organization is found by query (the person is not the kind of file that an organization can be)
      bidir: false
      target_types: entity/x-vnd.sen-labs.entity.organization
      label: works for
      inverse_label: employs
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person

  Membership:
    description: a person is a member of an organization or group
    title: Membership
    is_a: Relation
    class_uri: schema:memberOf
    slots: [rel_since, rel_note]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.person.membership
      app: application/x-vnd.sen-plugin.sen-labs.personal-relation-navigator
      icon: x-vnd.sen-labs.entity.organization
      group: Organizations
      # stored at the person only: what points to an organization is found by query (the person is not the kind of file that an organization can be)
      bidir: false
      target_types: entity/x-vnd.sen-labs.entity.organization
      label: member of
      inverse_label: has member
      source_types: entity/x-vnd.sen-labs.entity.person,application/x-person
