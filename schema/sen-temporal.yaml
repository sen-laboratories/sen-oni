#
# Events and times: when something happens, how long it takes, and how two such times are related.
#
# An EVENT is any thing that occurs in time (a meeting, a trip, a task, the shooting of a film). Its time is a START, an END, or a START and a DURATION. The attributes are
# plain attributes of the file, and ANY file can carry them (a photo, a document, a task): the temporal engine builds the interval from them. They follow schema.org (Event:
# startDate, endDate, duration), which is also what W3C OWL-Time (time:hasBeginning, time:hasEnd, time:hasDuration) says in other words; the Instants and Intervals of OWL-Time
# are not entities of their own here, they would be one more file for every start and end.
#
# A time can be exact or fuzzy. The start and the end are of the type TIME (the earliest moment of the value): they sort, are shown in the columns of the file manager and are found with a query. They are
# indexed (BFS indexes a time as the 64-bit integer that holds it), so they must be written as 64-bit times (time_t). A value that is fuzzy ("1994-05~", "202X", "1994?", in the Extended Date/Time Format, EDTF, ISO 8601-2) is also kept as text in the attribute beside it
# (Start Date EDTF, End Date EDTF), which the engine reads when it is there; an exact time has no text. The duration is the ISO 8601 text (PT2H, P3D).
#
# The temporal relations between two things (before, meets, overlaps, during, equals and their inverses: Allen's interval algebra, W3C OWL-Time time:intervalBefore and so on) are
# DYNAMIC: they are not stored, the temporal navigator works them out from the intervals when the relation is chosen, so they never go stale when a time is corrected. An interval
# is the start and the end, or the start and the duration, or a start that is a day, a month or a year (the whole period); a start alone is an instant. A time that is not exact counts
# with its widest extent. A day ends where the next one begins, so two days meet. Each relation type has two directions (before / after), as the spatial ones have (within / contains).
id: https://sen-labs.org/ns/oni/temporal
name: sen_temporal
title: SEN Temporal
description: This ontology defines events and the times that things have (start, end and duration), exact or fuzzy (EDTF).
version: 0.1.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  sen: https://sen-labs.org/ns/sen#
  dc: http://purl.org/dc/elements/1.1/
  dcterms: http://purl.org/dc/terms/
  schema: https://schema.org/
  time: http://www.w3.org/2006/time#
  wd: http://www.wikidata.org/entity/
default_prefix: sen
default_range: string
imports:
  - linkml:types
  - sen-core
annotations:
  oni_author: Gregor B. Rosenauer <gregor.rosenauer@gmail.com>
  oni_stable: false
  oni_schema_url: https://github.com/sen-laboratories/sen-oni/tree/main/schema/sen-temporal.yaml

slots:
  title:
    description: The name of the event (the property is called Title so that it is not taken for the name of the file, which a file manager shows as Name).
    title: Title
    slot_uri: dc:title
    annotations: {attribute: "dc:title", width: 150}
  description:
    description: What there is to say about the event.
    title: Description
    slot_uri: dc:description
    annotations: {attribute: "dc:description", width: 200}
  event_type:
    description: >-
      What kind of event it is, in a word or two: a birthday, a wedding, a meeting, a phone call. The common kinds are offered (Event Type values, mapped to Wikidata); any other text is allowed.
    title: Event Type
    range: EventType
    annotations: {attribute: "SEN:eventType", width: 110, allow_custom: true}
  start_date:
    description: >-
      When the event starts (time:hasBeginning), as a time. For a fuzzy start (Start Date EDTF) it is the earliest moment of the value, so that the events sort and are found with a query.
    title: Start
    range: datetime
    slot_uri: schema:startDate
    annotations: {attribute: "schema:startDate", searchable: true, width: 120}
  end_date:
    description: >-
      When the event ends (time:hasEnd), as a time. For a fuzzy end (End Date EDTF) it is the latest moment of the value. An event with a start and a duration has no end of its own.
    title: End
    range: datetime
    slot_uri: schema:endDate
    annotations: {attribute: "schema:endDate", searchable: true, width: 120}
  start_date_edtf:
    description: >-
      The start as it was said, when it is not exact: 1994? (the year is uncertain), 1994-05~ (about May 1994), 202X (some year of the 2020s). The text is in the Extended Date/Time Format
      (EDTF, ISO 8601-2). An exact start has none.
    title: Start (EDTF)
    annotations: {attribute: "SEN:startDateEdtf", viewable: false, width: 110}
  end_date_edtf:
    description: The end as it was said, when it is not exact (see Start (EDTF)). An exact end has none.
    title: End (EDTF)
    annotations: {attribute: "SEN:endDateEdtf", viewable: false, width: 110}
  duration:
    description: The length of the event, as an ISO 8601 duration (PT2H, PT1H55M, P3D); for an event that has a start and no end.
    title: Duration
    slot_uri: schema:duration
    annotations: {attribute: "schema:duration", width: 30}

  uid:
    description: The identifier that the calendar file gives the event (UID), the same in every copy of an invitation and every instance of a series.
    title: Identifier
    slot_uri: dc:identifier
    annotations: {attribute: "dc:identifier", searchable: true, viewable: false, width: 110}
  location:
    description: Where the event takes place, as the calendar file says it (an address, a room, a name). The place itself is the relation Location.
    title: Location
    slot_uri: schema:location
    annotations: {attribute: "schema:location", width: 160}
  organizer:
    description: Who organizes the event, as Name <address>. The people of an event are the relation Attendee.
    title: Organizer
    slot_uri: schema:organizer
    annotations: {attribute: "schema:organizer", width: 140}
  event_status:
    description: Whether the event is going ahead, as the calendar file says it (STATUS).
    title: Event Status
    range: EventStatus
    slot_uri: schema:eventStatus
    annotations: {attribute: "schema:eventStatus", searchable: true, width: 80, allow_custom: false}
  attendance_mode:
    description: Whether the event takes place at a place, online, or both.
    title: Attendance
    range: AttendanceMode
    slot_uri: schema:eventAttendanceMode
    annotations: {attribute: "schema:eventAttendanceMode", width: 80, allow_custom: false}
  url:
    description: The web page of the event (URL of the calendar file).
    title: URL
    slot_uri: schema:url
    annotations: {attribute: "schema:url", viewable: false, width: 160}
  meeting_url:
    description: The link to join an online meeting that the event has, found in the conference properties, the location or the description of the calendar file.
    title: Meeting URL
    annotations: {attribute: "SEN:meetingUrl", viewable: false, width: 160}
  meeting_type:
    description: The service of the online meeting (Zoom, Google Meet, Microsoft Teams...), worked out from its link, so that events can be shown, sorted and searched by it.
    title: Meeting Type
    range: MeetingType
    annotations: {attribute: "SEN:meetingType", searchable: true, width: 100, allow_custom: true}
  recurrence:
    description: How the event repeats, as the recurrence rule of the calendar file (FREQ=WEEKLY;BYDAY=MO), for programs; it is not shown. It is kept in step with the words of Repeats (Shoji and Akita write both). An empty one says that the event does not repeat, also when the calendar file says it does.
    title: Recurrence
    annotations: {attribute: "SEN:recurrence", viewable: false, width: 140}
  repeats:
    description: How the event repeats, in words (every week on Monday, every year until 2030-12-31), for people. Choose a usual value or type simple words (every 2 weeks), and the recurrence rule follows. An event that does not repeat has none.
    title: Repeats
    slot_uri: schema:repeatFrequency
    range: RepeatStyle
    annotations: {attribute: "schema:repeatFrequency", width: 160}
  attendees:
    description: >-
      The people of the event as the calendar file says them (Name <address>, with the role and the answer to the invitation in brackets), for a list that can be read at a glance and searched. The people themselves
      are the relation Attendee; this list is kept up to date when the file is enriched.
    title: Attendees
    slot_uri: schema:attendee
    annotations: {attribute: "schema:attendee", is_list: true, list_separator: ";", editable: false, width: 220}
  response:
    description: The answer of the person to the invitation, as the calendar file says it (accepted, declined, tentative, needs action, delegated). It belongs to the Attendee relation between the event and the person, not to the person.
    title: Response
    range: ResponseStatus
    annotations: {attribute: "SEN:REL:Response", width: 90, allow_custom: false}
  recurrence_id:
    description: Which instance of a series the relation is about, as the RECURRENCE-ID of the calendar file (20261123T090000).
    title: Instance
    annotations: {attribute: "SEN:REL:RecurrenceId", viewable: false, width: 120}

  event_count:
    description: How many events a calendar holds.
    title: Events
    range: integer
    annotations: {attribute: "SEN:eventCount", width: 50}
  allen:
    description: >-
      The relation in Allen's interval algebra as the comparison of the two intervals gave it: before, after, meets, met by, overlaps, overlapped by, during, contains, equals, starts,
      started by, finishes, finished by. The name in words is the property Kind.
    title: Allen
    annotations: {attribute: "SEN:REL:Allen", viewable: false, width: 90}

classes:
  Event:
    description: >-
      an event: anything that occurs in time (a meeting, a trip, a task, a shooting). Its time is a start and an end, or a start and a duration; each can be exact or fuzzy. Any file can have
      these properties, the event is the entity that is about nothing else
    title: Event
    is_a: Entity
    class_uri: schema:Event
    slots: [title, event_type, description, uid, location, organizer, event_status, attendance_mode, url, meeting_url, meeting_type, recurrence, repeats, attendees, start_date, start_date_edtf, end_date, end_date_edtf, duration]
    slot_usage: {plural: {ifabsent: "string(Events)"}}
    annotations: {mime: entity/x-vnd.sen-labs.entity.event, icon: x-vnd.sen-labs.entity.event}
  Calendar:
    description: >-
      a calendar: the umbrella for the events that a calendar file holds (an export, a subscription, a shared calendar). Its time is the time that its events cover. A file with a
      single event is that event
    title: Calendar
    is_a: Entity
    class_uri: schema:Schedule
    slots: [title, description, url, event_count, start_date, end_date]
    slot_usage: {plural: {ifabsent: "string(Calendars)"}}
    annotations: {mime: entity/x-vnd.sen-labs.entity.calendar, icon: x-vnd.sen-labs.entity.calendar}
  # The type that Haiku gives to calendar files (.ics, .vcs). It is not ours: only its icon is set in the MIME database of the user (an overlay), because the system has none
  # and a calendar file would show the icon of a text file. The meaning of the file (an event, a calendar) is its semantic type.
  CalendarFile:
    description: the type of calendar files (iCalendar, vCalendar)
    title: iCalendar
    annotations: {mime: text/calendar, overlay: true, icon: x-vnd.sen-labs.entity.calendar}

  # ---- the relations of Allen's interval algebra (the subset of OWL-Time that people use), worked out when asked
  TemporalBetween:
    description: >-
      the thing ends before the other one begins, with a gap between them (Allen's before); seen from the other one it comes after. The relation is called Between, the directions
      before and after: one gap lies between the two
    title: Between
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalBefore
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.between
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: before
      inverse_label: after
      source_attributes: schema:startDate
      exclude_types: entity/x-vnd.sen-labs.entity.calendar
  TemporalMeets:
    description: the thing ends at the very moment that the other one begins (Allen's meets), like two days in a row; seen from the other one it is met by it
    title: Meets
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalMeets
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.meets
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: meets
      inverse_label: met by
      source_attributes: schema:startDate
      exclude_types: entity/x-vnd.sen-labs.entity.calendar
  TemporalOverlaps:
    description: the thing begins before the other one and ends inside it (Allen's overlaps), the usual collision of two appointments; seen from the other one it is overlapped by it
    title: Overlaps
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalOverlaps
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.overlaps
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: overlaps
      inverse_label: overlapped by
      source_attributes: schema:startDate
      exclude_types: entity/x-vnd.sen-labs.entity.calendar
  TemporalDuring:
    description: the thing lies inside the other one, beginning after it and ending before it (Allen's during); seen from the other one it contains the thing
    title: During
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalDuring
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.during
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: during
      inverse_label: contains
      source_attributes: schema:startDate
      exclude_types: entity/x-vnd.sen-labs.entity.calendar
  TemporalEquals:
    description: the thing has the same beginning and the same end as the other one (Allen's equals)
    title: Equals
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalEquals
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.equals
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: equals
      inverse_label: equals
      source_attributes: schema:startDate
      exclude_types: entity/x-vnd.sen-labs.entity.calendar

  CalendarEvents:
    description: >-
      an event that the calendar holds. The events are places in the same file, as the pages of a document are (a self relation, which the calendar extractor reads from the file when it is asked); each has
      its title, start, end and identifier. The items are only places in the file: when one is kept or its relations are asked for, the plugin makes the event of it (a file of its own,
      found again by its identifier). Seen from the event it is part of the calendar
    title: Events
    is_a: Relation
    slots: [title, start_date, end_date, uid]
    class_uri: schema:event
    annotations:
      mime: relation/x-vnd.sen-labs.relation.calendar.events
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.calendar-extractor
      dynamic: true
      contained: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: contains
      inverse_label: part of
      source_types: entity/x-vnd.sen-labs.entity.calendar
      target_types: entity/x-vnd.sen-labs.entity.event
      materialise_as: entity/x-vnd.sen-labs.entity.event
  # ---- what a calendar file says about an event, worked out from the file when asked
  EventAttendee:
    description: >-
      a person who is invited to the event or organizes it, as the calendar file says; the role is the Role of the relation (organizer, required, optional, chair, resource) and the answer to the
      invitation its Response (accepted, declined, tentative, needs action, delegated). Seen from the person, the person attends the event
    title: Attendee
    is_a: Relation
    slots: [rel_role, response]
    class_uri: schema:attendee
    annotations:
      mime: relation/x-vnd.sen-labs.relation.event.attendee
      icon: x-vnd.sen-labs.entity.person
      app: application/x-vnd.sen-plugin.sen-labs.calendar-extractor
      dynamic: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: attendee
      inverse_label: attends
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.person
  EventDescription:
    description: the Markdown file that holds the description of the event, beside it with the same name (made when the event is enriched); seen from the file, it describes the event
    title: Description
    is_a: Relation
    slots: [rel_kind]
    class_uri: schema:description
    annotations:
      mime: relation/x-vnd.sen-labs.relation.event.description
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.calendar-extractor
      dynamic: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: described in
      inverse_label: describes
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: text/markdown
  EventLocation:
    description: the place where the event takes place, as the calendar file says (its location text, with the coordinates if it has them); seen from the place, it hosts the event
    title: Takes place at
    is_a: Relation
    slots: [rel_kind]
    class_uri: schema:location
    annotations:
      mime: relation/x-vnd.sen-labs.relation.event.location
      icon: x-vnd.sen-labs.entity.place
      app: application/x-vnd.sen-plugin.sen-labs.calendar-extractor
      dynamic: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: takes place at
      inverse_label: hosts
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.place
  EventSeries:
    description: >-
      the instance of a repeating event just before or after this one, worked out from its recurrence rule (with the exceptions and moved instances of the file). The instances are places
      in the same calendar file, as the pages of a document are; each has its title, start and end
    title: Series
    is_a: Relation
    slots: [title, start_date, end_date, recurrence_id]
    class_uri: schema:eventSchedule
    annotations:
      mime: relation/x-vnd.sen-labs.relation.event.series
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.calendar-extractor
      dynamic: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: next
      inverse_label: previous
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.event

enums:
  EventType:
    description: The common kinds of events, mapped to Wikidata. They are offered to choose from; the type of an event is text, and any other value is allowed.
    permissible_values:
      # --- Root classes
      Anniversary:
        meaning: wd:Q238907
      Ceremony:
        meaning: wd:Q2659904
      Party:
        meaning: wd:Q200538
      # --- Anniversaries and milestones
      Birthday:
        meaning: wd:Q47223
      WeddingAnniversary:
        meaning: wd:Q2005510
      Jubilee:
        meaning: wd:Q1908864
      DeathAnniversary:
        meaning: wd:Q1208945
      # --- Ceremonies
      Wedding:
        meaning: wd:Q119639
      Funeral:
        meaning: wd:Q201559
      Graduation:
        meaning: wd:Q1928923
      Baptism:
        meaning: wd:Q35856
      # --- Social gatherings
      DinnerParty:
        meaning: wd:Q1753443
      Housewarming:
        meaning: wd:Q1206109
      FarewellParty:
        meaning: wd:Q1390022
      BabyShower:
        meaning: wd:Q797880
      # --- Business and communication
      Meeting:
        meaning: wd:Q2761147
      Conference:
        meaning: wd:Q114834437
      TelephoneCall:
        meaning: wd:Q2296401
      VideoConference:
        meaning: wd:Q238354
      # --- Holidays and observances
      Holiday:
        meaning: wd:Q1445650
        description: A festive day set aside by custom or by law.
      PublicHoliday:
        meaning: wd:Q1197685
        aliases:
          - NationalHoliday
          - StatutoryHoliday
        description: A holiday established by law, usually a non-working day.
      NationalDay:
        meaning: wd:Q57598
        description: A designated date celebrating the nationhood of a country.
      ReligiousHoliday:
        meaning: wd:Q375011
        aliases:
          - SpiritualHoliday
          - HolyDay
        description: A day or period of special spiritual or religious importance.
      Festival:
        meaning: wd:Q132241
        description: A recurring cultural, religious, or thematic celebration.
      Observance:
        meaning: wd:Q16675435
        description: A commemorative or awareness day on the calendar.
  RepeatStyle:
    description: >-
      The common ways in which an event repeats, in the words that the calendar extractor makes of a recurrence rule. They are offered to choose from; how an event repeats is text, and any other
      description is allowed (every 2 weeks on Monday and Thursday, every year until 2030-12-31).
    permissible_values:
      EveryDay:
        title: every day
      EveryWeekday:
        title: every weekday
      EveryWeek:
        title: every week
      EveryMonth:
        title: every month
      EveryYear:
        title: every year
  EventStatus:
    description: Whether an event is going ahead.
    permissible_values:
      Confirmed:
      Tentative:
      Cancelled:
  AttendanceMode:
    description: How people take part in an event.
    permissible_values:
      Offline:
        description: at a place
      Online:
        description: by a link
      Mixed:
        description: at a place and online
  MeetingType:
    description: The services of online meetings that are known by their links. Any other service can be written in.
    permissible_values:
      Zoom:
      GoogleMeet:
        title: Google Meet
      MicrosoftTeams:
        title: Microsoft Teams
      Webex:
      Jitsi:
      GoToMeeting:
        title: GoToMeeting
      Whereby:
      Skype:
      Other:
  ResponseStatus:
    description: The answer of a person to an invitation.
    permissible_values:
      Accepted:
      Declined:
      Tentative:
      NeedsAction:
      Delegated:
