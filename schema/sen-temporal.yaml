#
# Events and times: when something happens, how long it takes, and how two such times are related.
#
# An EVENT is any thing that occurs in time (a meeting, a trip, a task, the shooting of a film). Its time is a START, an END, or a START and a DURATION. The attributes are
# plain attributes of the file, and ANY file can carry them (a photo, a document, a task): the temporal engine builds the interval from them. They follow schema.org (Event:
# startDate, endDate, duration), which is also what W3C OWL-Time (time:hasBeginning, time:hasEnd, time:hasDuration) says in other words; the Instants and Intervals of OWL-Time
# are not entities of their own here, they would be one more file for every start and end.
#
# A time can be exact or fuzzy. The start and the end are of the type TIME (the earliest moment of the value): they sort and are shown in the columns of the file manager. (BFS cannot index the type TIME,
# so a query cannot ask for a date: the files of the type Event are found by their type, and the engine compares the times.) A value that is fuzzy ("1994-05~", "202X", "1994?", in the Extended Date/Time Format, EDTF, ISO 8601-2) is also kept as text in the attribute beside it
# (Start Date EDTF, End Date EDTF), which the engine reads when it is there; an exact time has no text. The duration is the ISO 8601 text (PT2H, P3D).
#
# The temporal relations between two things (before, meets, overlaps, during, equals and their inverses: Allen's interval algebra, W3C OWL-Time time:intervalBefore and so on) are
# DYNAMIC: they are not stored, the temporal navigator works them out from the intervals when the relation is chosen, so they never go stale when a time is corrected. An interval
# is the start and the end, or the start and the duration, or a start that is a day, a month or a year (the whole period); a start alone is an instant. A time that is not exact counts
# with its widest extent. A day ends where the next one begins, so two days meet. Each relation type has two directions (before / after), as the spatial ones have (within / contains).
id: https://sen-labs.org/ns/oni/temporal
name: sen_temporal
title: SEN Temporal
description: This ontology defines events and the times that things have (start, end and duration), exact or fuzzy (EDTF).
version: 0.1.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  sen: https://sen-labs.org/ns/sen#
  dc: http://purl.org/dc/elements/1.1/
  dcterms: http://purl.org/dc/terms/
  schema: https://schema.org/
  time: http://www.w3.org/2006/time#
default_prefix: sen
default_range: string
imports:
  - linkml:types
  - sen-core
annotations:
  oni_author: Gregor B. Rosenauer <gregor.rosenauer@gmail.com>
  oni_stable: false
  oni_schema_url: https://github.com/sen-laboratories/sen-oni/tree/main/schema/sen-temporal.yaml

slots:
  title:
    description: The name of the event (the property is called Title so that it is not taken for the name of the file, which a file manager shows as Name).
    title: Title
    slot_uri: dc:title
    annotations: {attribute: "dc:title", width: 150}
  description:
    description: What there is to say about the event.
    title: Description
    slot_uri: dc:description
    annotations: {attribute: "dc:description", viewable: false}
  start_date:
    description: >-
      When the event starts (time:hasBeginning), as a time. For a fuzzy start (Start Date EDTF) it is the earliest moment of the value, so that the events sort.
    title: Start
    range: datetime
    slot_uri: schema:startDate
    annotations: {attribute: "schema:startDate", width: 120}
  end_date:
    description: >-
      When the event ends (time:hasEnd), as a time. For a fuzzy end (End Date EDTF) it is the latest moment of the value. An event with a start and a duration has no end of its own.
    title: End
    range: datetime
    slot_uri: schema:endDate
    annotations: {attribute: "schema:endDate", width: 120}
  start_date_edtf:
    description: >-
      The start as it was said, when it is not exact: 1994? (the year is uncertain), 1994-05~ (about May 1994), 202X (some year of the 2020s). The text is in the Extended Date/Time Format
      (EDTF, ISO 8601-2). An exact start has none.
    title: Start (EDTF)
    annotations: {attribute: "SEN:startDateEdtf", viewable: false, width: 110}
  end_date_edtf:
    description: The end as it was said, when it is not exact (see Start (EDTF)). An exact end has none.
    title: End (EDTF)
    annotations: {attribute: "SEN:endDateEdtf", viewable: false, width: 110}
  duration:
    description: The length of the event, as an ISO 8601 duration (PT2H, PT1H55M, P3D); for an event that has a start and no end.
    title: Duration
    slot_uri: schema:duration
    annotations: {attribute: "schema:duration", width: 30}

  allen:
    description: >-
      The relation in Allen's interval algebra as the comparison of the two intervals gave it: before, after, meets, met by, overlaps, overlapped by, during, contains, equals, starts,
      started by, finishes, finished by. The name in words is the property Kind.
    title: Allen
    annotations: {attribute: "SEN:REL:Allen", viewable: false, width: 90}

classes:
  Event:
    description: >-
      an event: anything that occurs in time (a meeting, a trip, a task, a shooting). Its time is a start and an end, or a start and a duration; each can be exact or fuzzy. Any file can have
      these properties, the event is the entity that is about nothing else
    title: Event
    is_a: Entity
    class_uri: schema:Event
    slots: [title, description, start_date, start_date_edtf, end_date, end_date_edtf, duration]
    slot_usage: {plural: {ifabsent: "string(Events)"}}
    annotations: {mime: entity/x-vnd.sen-labs.entity.event, icon: x-vnd.sen-labs.entity.event}

  # ---- the relations of Allen's interval algebra (the subset of OWL-Time that people use), worked out when asked
  TemporalBefore:
    description: the thing ends before the other one begins, with a gap between them (Allen's before); seen from the other one it comes after
    title: Before
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalBefore
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.before
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: before
      inverse_label: after
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.event
  TemporalMeets:
    description: the thing ends at the very moment that the other one begins (Allen's meets), like two days in a row; seen from the other one it is met by it
    title: Meets
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalMeets
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.meets
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: meets
      inverse_label: met by
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.event
  TemporalOverlaps:
    description: the thing begins before the other one and ends inside it (Allen's overlaps), the usual collision of two appointments; seen from the other one it is overlapped by it
    title: Overlaps
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalOverlaps
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.overlaps
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: overlaps
      inverse_label: overlapped by
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.event
  TemporalDuring:
    description: the thing lies inside the other one, beginning after it and ending before it (Allen's during); seen from the other one it contains the thing
    title: During
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalDuring
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.during
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: during
      inverse_label: contains
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.event
  TemporalEquals:
    description: the thing has the same beginning and the same end as the other one (Allen's equals)
    title: Equals
    is_a: Relation
    slots: [rel_kind, allen]
    class_uri: time:intervalEquals
    annotations:
      mime: relation/x-vnd.sen-labs.relation.temporal.equals
      icon: x-vnd.sen-labs.entity.event
      app: application/x-vnd.sen-plugin.sen-labs.temporal-navigator
      dynamic: true
      remote: true
      group: Temporal
      folder_icon: x-vnd.sen-labs.relation.temporal.folder
      label: equals
      inverse_label: equals
      source_types: entity/x-vnd.sen-labs.entity.event
      target_types: entity/x-vnd.sen-labs.entity.event
