id: https://sen-labs.org/ns/oni/sourcecode
name: sen_sourcecode
title: SEN Source Code
description: This ontology defines entities and relations for software development.
version: 0.1.0
license: MIT
prefixes:
  linkml: https://w3id.org/linkml/
  sen: https://sen-labs.org/ns/sen#
  dc: http://purl.org/dc/elements/1.1/
  dcterms: http://purl.org/dc/terms/
  schema: https://schema.org/
  oa: http://www.w3.org/ns/oa#
  be: https://www.haiku-os.org/ns/be#
default_prefix: sen
default_range: string
imports:
  - linkml:types
  - sen-core
annotations:
  oni_author: Gregor B. Rosenauer <gregor.rosenauer@gmail.com>
  oni_stable: false
  oni_schema_url: https://github.com/sen-laboratories/sen-oni/tree/main/schema/sen-sourcecode.yaml

slots:
  include_path:
    description: The path of the include as written in the source.
    title: Include Path
    annotations: {attribute: "SEN:REL:includePath"}
  include_global:
    description: A global (system) include (angle brackets), not a local one.
    title: Global?
    range: boolean
    annotations: {attribute: "SEN:REL:includeGlobal", width: 30}

classes:
  SourceInclude:
    description: include dependency to another sourcecode
    title: Source Include
    is_a: Relation
    slots: [include_path, include_global, line]
    annotations:
      mime: relation/x-vnd.sen-labs.relation.sourcecode.include
      app: application/x-vnd.sen-plugin.sen-labs.text-reference-navigator
      dynamic: true
      contained: true     # MAY be represented as a contained relation

  SourceCodeFile:
    description: >-
      Source code, the type that Haiku gives to the files of all programming languages. The list of extensions is the one of the system
      (as dumped from the MIME database) plus those of the languages that the source code plugin of SENSEI understands, so that Tracker
      types such files as source code and SEN can examine them. The language itself is the semantic type, the attribute META:TYPE.
    title: Source Code
    annotations:
      mime: text/x-source-code
      extensions: >-
        asm, bas, c, c++, cc, cjs, cpp, cs, cts, cxx, e, go, h, h++, hh, hpp, hxx, icc, inc, inl, ipp, java, js, json, jsp, jsx, lua, m, mjs, mm,
        mts, pas, php, pl, pp, py, pyi, pyw, rb, recipe, rexx, rs, S, sql, swift, tcc, tcl, toml, tpp, ts, tsx, txx, yaml

